<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before first paint so dark mode never flashes light. -->
    <script>try{if(localStorage.getItem('quill.theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
    <link rel="icon" type="image/png" href="./quill-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quill — Wellness & Beauty</title>

    <!-- PWA / installable app shell (relative paths → works at any URL sub-path) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#FAF6ED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Quill" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Trimmed to the weights actually used: Instrument Serif (display) +
         Libre Franklin 400-700 (body) are the workhorses; Cormorant is only
         used italic-400 (display-italic); Fraunces is barely used (1 spot),
         kept light/regular as a serif fallback. Big cut to font payload. -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Instrument+Serif:ital@0;1&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
